# Combined workflow for documentation updates and static content deployment to GitHub Pages
name: Feature Branch Updates

on:
  # Runs after feature-CodeSL.yml completes successfully
  workflow_run:
    workflows: ["CodeQL Advanced"]
    types:
      - completed
    branches:
      - f-*

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  info:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Output GitHub Info (safe) 
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
  # First job: Update documentation/version
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: info
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore

  test:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
 
      - name: Test
        run: dotnet test --no-restore 