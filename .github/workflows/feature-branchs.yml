# Combined workflow for documentation updates and static content deployment to GitHub Pages
name: Feature Branch Updates

on:
  # Runs on pushes to feature branches
  push:
    branches:
      - f-*

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  commit-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_PAT }}

      - name: Install xmlstarlet
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Update README with version
        run: |
          # Generate version string and updates README.md
          VER="$(xmlstarlet sel -t -v "/Project/PropertyGroup/Version" filescrubberMCP.csproj)"
          echo "VER=$VER" >> $GITHUB_ENV
          sed "s|_VER_|$VER|g" Documents/README_TEMPLATE.md > README.md


      - name: Configure Git user
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Commit and push changes
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.ACTION_PAT }}@github.com/${{ github.repository }}.git
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generated Version Update: $VER"
            git push
          fi
        env:
          VER: ${{ env.VER }}
      - name: Show Repository Files
        run: ls -ltR .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-artifact
          # Upload entire repository
          path: .
  info:
    runs-on: ubuntu-latest
    needs: commit-changes
    steps:
      - name: Output GitHub Info (safe) 
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
  # First job: Update documentation/version
  build:
    runs-on: ubuntu-latest
    needs: info
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
 
      - name: Test
        run: dotnet test --no-restore 