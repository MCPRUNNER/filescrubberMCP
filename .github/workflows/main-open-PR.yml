# Combined workflow for documentation updates and static content deployment to GitHub Pages
name: PR-Deploy static content to Pages

on:
  push: ["main"]
  pull_request:
    types:
      - opened
    branches-ignore: 
      - f-*
 

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.

jobs:
  # First job: Update documentation/version
  
  # Second job: Deploy to GitHub Pages (runs after commit-changes)
  deploy:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5.0.0
        with:
          token: ${{ secrets.ACTION_PAT }}
          ref: 'main'

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-artifact
          # Upload entire repository
          path: .